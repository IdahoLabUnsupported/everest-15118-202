description: >-
  This module implements an DIN70121, ISO15118-2 and ISO15118-20 EV using the Josev project.
config:
  device:
    description: >-
      Ethernet device used for HLC. Any local interface that has an ipv6 link-local and a MAC addr will work.
    type: string
    default: eth0
  supported_DIN70121:
    description: The EV supports the DIN SPEC
    type: boolean
    default: false
  supported_ISO15118_2:
    description: The EV supports ISO15118-2
    type: boolean
    default: false
  supported_ISO15118_20_AC:
    description: The EV supports ISO15118-20 AC
    type: boolean
    default: false
  supported_ISO15118_20_DC:
    description: The EV supports ISO15118-20 DC
    type: boolean
    default: false
  tls_active:
    description: If true, EVCC connects to SECC as TLS client
    type: boolean
    default: false
  enforce_tls:
    description: The EVCC will enforce a TLS connection
    type: boolean
    default: false
  is_cert_install_needed:
    description: >-
      If true, the contract certificate will be installed via the evse.
      And any existing contract certificate will also be overwritten.
    type: boolean
    default: false
  enable_tls_1_3:
    description: The EVCC will enable TLS version 1.3
    type: boolean
    default: false
  is_internet_service_needed:
    description: If true, the ev will ask for internet service
    type: boolean
    default: false
  request_all_service_details:
    description: If true, the ev will ask for details about all offered services
    type: boolean
    default: false
  select_all_vas_services:
    description: If true, the ev will select all offered services
    type: boolean
    default: false
  max_contactor_celsius_temperature:
    description: >-
      Maximum contactor temperature in degrees Celsius, advertised in ESDPReq
      ConductiveChargingInterfaceLimitations [V2G202-0103]. Per the standard
      this is the EV's contactor hardware rating at the vehicle inlet/connector
      — not an arbitrary placeholder. Typical values are 80–105 °C depending
      on the contactor part. Set to the rating from the contactor manufacturer's
      spec sheet for this EV.
    type: integer
    default: 80
  ev_world_manufacturer_identifier:
    description: >-
      Three-character ISO 3779 world manufacturer identifier (WMI) advertised
      in ESDPReq EVCharacteristics [V2G202-0107].
    type: string
    default: "1HG"
  ev_vehicle_descriptor_section:
    description: >-
      Optional ISO 3779 vehicle descriptor section (VDS) advertised in ESDPReq
      EVCharacteristics [V2G202-0108]. Leave empty to omit this field.
    type: string
    default: ""
  ev_vehicle_indicator_section:
    description: >-
      Optional ISO 3779 vehicle indicator section (VIS) advertised in ESDPReq
      EVCharacteristics [V2G202-0109]. Leave empty by default; if configured,
      it must not include any part of the VIS that allows identification of a
      specific EV [V2G202-0110].
    type: string
    default: ""
  evcc_software_version:
    description: >-
      Optional EVCC software version advertised in ESDPReq EVCharacteristics.
      Leave empty to omit this field.
    type: string
    default: ""
  supported_d20_energy_services:
    description: >-
      The supported ISO15118-20 energy services (DC, DC_BPT, AC, AC_BPT) the EV supports,
      provided as a prioritized list. The first entry in the list has the highest priority
      and is the most likely to be selected. The services should be separated only with commas.
    type: string
    default: "DC,DC_BPT"
provides:
  ev:
    interface: ISO15118_ev
    description: This module implements the ISO15118-2 implementation of an EV
enable_external_mqtt: true
metadata:
  license: https://opensource.org/licenses/Apache-2.0
  authors:
    - Sebastian Lukas
